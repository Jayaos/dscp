# 27 trials; the same evaluation timestamps are used for every window size.
grid:
  model.window_size: [100, 200, 500]
  model.n_estimators: [10, 20, 50]
  model.max_depth: [2, 5, 10]

tuning:
  num_sequences: 3
  delta_threshold: -0.01
  # Reserve this tail fraction of the training prefix for tuning evaluation.
  # With train_ratio=0.66 and ratio=0.2, fit 52.8%, evaluate 13.2%, test 34%.
  model_selection_valid_ratio: 0.15
