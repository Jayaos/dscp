# Areces et al. experiment-code defaults; calibrate independently per series/coverage.
num_cores: 1

data:
  data_path: "./data/solar_prediction/lstm/lstm_nsdb-60m_data.pkl"
  calibration_ratio: 0.66
  test_ratio: 0.34

model:
  method: lqt
  target_quantiles:
    - [0.05, 0.95]
  # Fixed fallback values; the enabled tuning grid selects these for each series.
  learning_rate: 0.1
  p_order: 1
  bias: 1.0
  learning_rate_schedule: fixed
  decay_exponent: 0.6
  initial_quantile: 1.0
  score_type: absolute
  prediction_step: 1

# Use the entire calibration prefix for online candidate evaluation.
# Reset both states and the learning-rate clock before the untouched test suffix.
tuning:
  enabled: true
  learning_rate_grid: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0]
  p_order_grid: [0, 1, 2]
  bias_grid: [0.1, 1.0, 5.0, 10.0, 200.0, 100.0, 1000.0]
  coverage_tolerance: 0.01

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/lqt/solar/lstm/${now:%Y-%m-%d_%H-%M-%S_%f}/"
