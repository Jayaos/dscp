# CT-SSF LSTM adaptation v2; reuses the existing --save-model checkpoint.
# See baselines/ct_ssf/README.md. Inversion settings require validation tuning.
base_predictor: lstm
seed: 2026
device: cuda
num_threads: 4

data:
  data_path: "./data/air-10_prediction/lstm_model_saved/lstm_air-10_data.pkl"
  model_path: "./data/air-10_prediction/lstm_model_saved/lstm_air-10_model.pt"
  train_ratio: 0.4
  valid_ratio: 0.1
  calibration_ratio: 0.16
  test_ratio: 0.34

model:
  target_quantiles:
    - [0.05, 0.95]
    - [0.9, 0.1]
  calibration_size: 500
  rolling_calibration: true
  weighting: learned_attention
  bound_method: linear_exact
  inverse_steps: 200
  inverse_lr: 0.01
  inverse_optimizer: adam
  batch_size: 256

attention:
  embedding_dim: 32
  temperature: 0.5
  memory_size: 128
  epochs: 30
  patience: 5
  batch_size: 64
  learning_rate: 0.001

plotting:
  plotting: false
  plotting_seq_len: 200

saving_dir: "./results/ct_ssf/air/lstm/seed_${seed}/${now:%Y-%m-%d_%H-%M-%S_%f}/"
