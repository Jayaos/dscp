device: 0
base_predictor: lstm # choices: lr, lstm, chronos


data:
  data_path: "./data/air-10_prediction/${base_predictor}/${base_predictor}_air-10_data.pkl"
  train_ratio: 0.5
  valid_ratio: 0.16
  normalize: True
  strided_features: "xr"


model:
  head_type: nondecreasing # choices: nondecreasing, independent
  dim_model: 32
  num_heads: 2
  num_layers: 4
  dropout: 0.
  use_current_feature: False
  target_quantiles:
    - [0.025, 0.975]
  prediction_step: 1
  window_size: 100


training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 50
  early_stop: 3


plotting:
  plotting: True
  plotting_seq_len: 200
  

saving_dir: "./results/qr_cp/air/${base_predictor}/transformer/${model.head_type}/${now:%Y-%m-%d_%H-%M-%S_%f}/"
