device: 0
base_predictor: chronos # choices: lr, lstm, chronos


data:
  data_path: "./data/air-10_prediction/${base_predictor}/${base_predictor}_air-10_data.pkl"
  train_ratio: 0.5
  valid_ratio: 0.16
  normalize: True
  strided_features: "xry"


model:
  head_type: nondecreasing # choices: nondecreasing, independent
  rnn_type: "lstm"
  dim_model: 128
  num_layers: 1
  dropout: 0.
  use_current_feature: True
  target_quantiles:
    - [0.05, 0.95]
  prediction_step: 1
  window_size: 200


training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stop: 3


plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/qr_cp/air/${base_predictor}/rnn/${model.head_type}/${now:%Y-%m-%d_%H-%M-%S_%f}/"

