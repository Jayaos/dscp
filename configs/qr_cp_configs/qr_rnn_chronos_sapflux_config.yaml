device: 0
base_predictor: chronos # choices: lr, lstm, chronos

data:
  data_path: "./data/sapflux-solo3-large/${base_predictor}/${base_predictor}_sapflux-solo3-large_data.pkl"
  train_ratio: 0.5
  valid_ratio: 0.16
  normalize: True
  strided_features: "xr"

model:
  head_type: nondecreasing # choices: nondecreasing, independent
  rnn_type: "lstm"
  dim_model: 128
  num_layers: 1
  dropout: 0.
  use_current_feature: False
  target_quantiles:
    - [0.05, 0.95]
  prediction_step: 1
  window_size: 100

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stop: 3

plotting:
  plotting: True
  plotting_seq_len: 200

saving_dir: "./results/qr_cp/sapflux/${base_predictor}/rnn/${model.head_type}/"
