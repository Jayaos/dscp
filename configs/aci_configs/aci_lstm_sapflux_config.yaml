# Original simple ACI update with fixed hyperparameters for final evaluation.
num_cores: 1

data:
  data_path: "./data/sapflux-solo3-large/lstm/lstm_sapflux-solo3-large_data.pkl"
  calibration_ratio: 0.66
  test_ratio: 0.34

model:
  target_quantiles:
    - [0.025, 0.975]
  gamma: 0.1
  window_size: 100
  initial_alpha: null
  quantile_method: linear
  score_type: absolute
  prediction_step: 1

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/aci/sapflux/lstm/${now:%Y-%m-%d_%H-%M-%S_%f}/"
