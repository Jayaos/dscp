# Benchmark grid, not an original-paper tuning prescription.
grid:
  model.gamma: [0.01, 0.05, 0.1]
  model.window_size: [100, 500, 1250, 2000]

tuning:
  num_sequences: 3 # Same sequence count as the corresponding QR tuning grid; or all.
  delta_threshold: -0.01
  # First 50% initializes history; evaluate until the NexCP test boundary (~66%).
  initialization_ratio: 0.5
