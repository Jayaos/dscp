# Fixed ResCP Table 4 settings: Solar Transformer -> DSCP Chronos.
# Ratios partition the saved forecast suffix in chronological order.
seed: 2026

data:
  data_path: "./data/solar_prediction/chronos/chronos_nsdb-60m_data.pkl"
  calibration_ratio: 0.66
  test_ratio: 0.34
  normalize: true

model:
  target_quantiles:
    - [0.975, 0.025]
  prediction_step: 1
  reservoir_size: 512
  spectral_radius: 0.9
  leak_rate: 0.8
  input_scaling: 0.4
  connectivity: 0.2
  temperature: 0.1
  calibration_size: 7600
  # null defaults the Monte Carlo sample count to calibration_size.
  sampling_num: null
  use_beta_search: true
  beta_bins: 100
  decay: linear
  recurrence: upstream

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/rescp/solar/chronos/seed_${seed}/${now:%Y-%m-%d_%H-%M-%S_%f}/"
