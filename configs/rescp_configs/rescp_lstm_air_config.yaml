# Fixed ResCP Table 4 settings: Beijing RNN -> DSCP Air LSTM (RNN).
# Ratios partition the saved forecast suffix in chronological order.
seed: 2026

data:
  data_path: "./data/air-10_prediction/lstm/lstm_air-10_data.pkl"
  calibration_ratio: 0.66
  test_ratio: 0.34
  normalize: true

model:
  target_quantiles:
    - [0.975, 0.025]
  prediction_step: 1
  reservoir_size: 512
  spectral_radius: 1.3
  leak_rate: 0.95
  input_scaling: 0.25
  connectivity: 0.2
  temperature: 0.1
  calibration_size: 3200
  # null defaults the Monte Carlo sample count to calibration_size.
  sampling_num: null
  use_beta_search: true
  beta_bins: 100
  decay: linear
  recurrence: upstream

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/rescp/air/lstm/seed_${seed}/${now:%Y-%m-%d_%H-%M-%S_%f}/"
