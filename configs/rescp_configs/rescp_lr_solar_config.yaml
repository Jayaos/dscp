# Fixed ResCP Table 4 settings: Solar ARIMA -> DSCP LR.
# Ratios partition the saved forecast suffix in chronological order.
seed: 2026

data:
  data_path: "./data/solar_prediction/lr/lr_nsdb-60m_data.pkl"
  calibration_ratio: 0.66
  test_ratio: 0.34
  normalize: true

model:
  target_quantiles:
    - [0.05, 0.95]
  prediction_step: 1
  reservoir_size: 512
  spectral_radius: 1.0
  leak_rate: 0.8
  input_scaling: 0.2
  connectivity: 0.2
  temperature: 0.1
  calibration_size: 1500
  # null defaults the Monte Carlo sample count to calibration_size.
  sampling_num: null
  use_beta_search: true
  beta_bins: 100
  decay: linear
  recurrence: upstream

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/rescp_lr_solar/seed_${seed}/"
