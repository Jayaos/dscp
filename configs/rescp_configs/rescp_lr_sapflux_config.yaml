# Ratios partition the saved forecast suffix in chronological order.
seed: 2026

data:
  data_path: "./data/sapflux-solo3-large/lr/lr_sapflux-solo3-large_data.pkl"
  calibration_ratio: 0.5
  validation_ratio: 0.16
  test_ratio: 0.34
  normalize: true

model:
  target_quantiles:
    - [0.05, 0.95]
  prediction_step: 1
  reservoir_size: 512
  spectral_radius: 1.2
  leak_rate: 0.9
  input_scaling: 0.25
  connectivity: 0.2
  temperature: 0.1
  calibration_size: 3800
  # null defaults the Monte Carlo sample count to calibration_size.
  sampling_num: null
  use_beta_search: true
  beta_bins: 100
  decay: linear
  recurrence: upstream

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/rescp_lr_sapflux/seed_${seed}/"
