# Original Sapflow Ridge settings, shared across base predictors.
device: 0

parallel:
  enabled: False
  # Use one worker process per GPU. Each worker runs independent sequences
  # assigned to that GPU sequentially.
  devices: [0, 1]

data:
  data_path: "./data/sapflux-solo3-large/lr/lr_sapflux-solo3-large_data.pkl"
  train_ratio: 0.33
  valid_ratio: 0.33
  normalize: True

model:
  dim_context_encoding: auto
  dim_hopfield_hidden: auto
  use_temporal_encoding: False
  # Train MSE on absolute residuals; conformal selection uses signed residuals.
  predict_absolute_residual: True
  conformal_absolute_residual: False
  beta: 1
  memory_size: 4000
  y_lags: 1
  target_quantiles:
    - [0.05, 0.95]
  prediction_step: 1
  alpha: 0.1
  sampling_num: 1000

training:
  # The standard runner trains one entire sequence per batch.
  learning_rate: 0.01
  epochs: 3000
  validation_epochs: 30

plotting:
  plotting: True
  plotting_seq_len: 200

saving_dir: "./results/hopcpt/sapflux/lr/${now:%Y-%m-%d_%H-%M-%S_%f}/"
