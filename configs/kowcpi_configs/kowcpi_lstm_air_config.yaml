data:
  data_path: "./data/air-10_prediction/lstm/lstm_air-10_data.pkl"
  train_ratio: 0.5
  valid_ratio: 0.16
  normalize: True


model:
  target_quantiles:
    - [0.05, 0.95]
  prediction_step: 1

  # KOWCPI residual-block size. This corresponds to `past_window`
  # in the original KOWCPI_Codes implementation.
  past_window: 5

  # If null, use all calibration residuals available before each test point.
  history_window: null

  kernel: "epanechnikov"
  bandwidth: null
  bandwidth_range: [0.1, 3.0, 30]
  bins: 5

  weigh_residuals: False
  residual_weight_decay: 0.995
  max_training_blocks: null
  min_training_blocks: 2

  use_adaptive_window: False
  update_with_test: True


plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/kowcpi_lstm_air/"
