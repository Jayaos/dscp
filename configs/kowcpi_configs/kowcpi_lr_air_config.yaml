data:
  data_path: "./data/air-10_prediction/lr/lr_air-10_data.pkl"
  # Fractions of the saved heldout forecasts, not point-predictor training data.
  calibration_ratio: 0.66 # Test uses the remaining 1 - calibration_ratio.
  normalize: False


model:
  target_quantiles:
    - [0.025, 0.975]
  prediction_step: 1
  # KOWCPI residual-block size. This corresponds to `past_window`
  # in the original KOWCPI_Codes implementation.
  past_window: 100
  # If null, use a rolling residual history with the calibration length.
  history_window: null
  kernel: "epanechnikov"
  bandwidth: null
  bandwidth_range: [1.0, 5.0, 10.0, 20, 50, 100]
  # If True, KOWCPI searches asymmetric beta pairs in [0, alpha].
  # If False, only use the exact target_quantiles pair, e.g. [0.05, 0.95].
  use_beta_search: False
  bins: 5
  weigh_residuals: False
  residual_weight_decay: 0.995 # only used if `weigh_residuals` is True
  # Cap RNW training blocks to avoid O(n^2) AIC bandwidth memory on long Chronos sequences.
  max_training_blocks: null
  min_training_blocks: 2
  use_adaptive_window: False
  update_with_test: True


plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/kowcpi/air/lr/${now:%Y-%m-%d_%H-%M-%S_%f}/"
