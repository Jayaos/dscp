# Hu et al. COP: signed tails, ECDF, proportional rates, paper window100/scale0.5.
num_cores: 1

data:
  data_path: "./data/sapflux-solo3-large/lstm/lstm_sapflux-solo3-large_data.pkl"
  calibration_ratio: 0.66
  test_ratio: 0.34

model:
  target_quantiles:
    - [0.05, 0.95]
  score_type: signed
  prediction_step: 1
  # This fixed base rate is used only when tuning is disabled.
  learning_rate: 0.1
  window_size: 100
  scale: 0.5
  proportional_lr: true
  initial_quantile: 0.0
  cdf: ecdf
  # Reset after tuning, then warm up on the last selected window_size + 1 calibration observations.
  initialization: calibration_tail

# Original candidate rates; calibration-only selection is this benchmark's protocol.
# A null warmup excludes max(window_size_grid) + 1 steps for every candidate.
tuning:
  enabled: true
  learning_rate_grid: [1.0, 0.5, 0.1, 0.05]
  window_size_grid: [100]
  scale_grid: [0.5]
  coverage_tolerance: 0.01
  warmup_steps: null

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/cop/sapflux/lstm/${now:%Y-%m-%d_%H-%M-%S_%f}/"
