device: 0
base_predictor: chronos


data:
  data_path: "./data/solar_prediction/${base_predictor}/${base_predictor}_nsdb-60m_data.pkl"
  train_ratio: 0.5
  valid_ratio: 0.16
  normalize: True
  strided_features: "xry"


model:
  rnn_type: "lstm"
  dim_model: 16
  num_layers: 2
  dropout: 0.
  use_current_feature: False
  # Choose "partially_monotonic" or the legacy "cosine_embedding" IQN head.
  prediction_head: "partially_monotonic"
  iqn_hidden_dim: 16
  monotonic_num_layers: 2
  monotonic_activation: "tanh"
  cos_emb_dim: 16
  num_taus: 64
  target_quantiles:
    - [0.95, 0.05]
  prediction_step: 1
  window_size: 100


training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stop: 3
  validation_loss: "target_quantiles"


plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/iqn_cp/solar/${base_predictor}/rnn/${model.prediction_head}/"
