grid:
  model.prediction_head: [partially_monotonic] # uncomment to compare both
  # model.iqn_num_layers: [1, 2, 3] # cosine prediction MLP hidden-layer count
  # model.interval_mode: [direct, sampling] # cosine_embedding only
  # model.sampling_num: [1000] # cosine sampled validation/inference; separate from model.num_taus
  model.shared_dim: [32, 64]
  model.num_layers: [1, 2]
  model.use_current_feature: [True, False]
  model.window_size: [100, 200]
  model.monotonic_num_layers: [1, 2]
  model.num_taus: [4, 16]
  data.strided_features: ["xr", "xry"]
  training.learning_rate: [0.001]
  training.epochs: [50]
  training.early_stop: [3]
  # training.tau_mode: [sampled_quantiles, target_quantiles] # fixed-level diagnostic: prefer cosine interval_mode direct
  training.validation_loss: [target_quantiles] # Add sampled_quantiles to compare legacy random-level validation.


tuning:
  num_gpus: 2 # 1: sequential; >1: parallel trials (allocate matching GPUs in Slurm)
  num_sequences: 3 # positive integer or all
  delta_threshold: -0.01
  model_selection_valid_ratio: 0.15
