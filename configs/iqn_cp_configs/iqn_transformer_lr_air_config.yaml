device: 0
base_predictor: lr


data:
  data_path: "./data/air-10_prediction/${base_predictor}/${base_predictor}_air-10_data.pkl"
  train_ratio: 0.5
  valid_ratio: 0.16
  normalize: True
  strided_features: "xry"


model:
  dim_model: 32
  num_heads: 2
  num_layers: 2
  dropout: 0.
  use_current_feature: False
  # Choose "partially_monotonic" or the legacy "cosine_embedding" IQN head.
  prediction_head: "partially_monotonic"
  iqn_hidden_dim: 32
  monotonic_num_layers: 1
  monotonic_activation: "tanh"
  cos_emb_dim: 32
  num_taus: 512
  target_quantiles:
    - [0.95, 0.05]
  prediction_step: 1
  window_size: 100


training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stop: 3
  validation_loss: "target_quantiles"


plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/iqn_cp/air/${base_predictor}/transformer/${model.prediction_head}/${now:%Y-%m-%d_%H-%M-%S_%f}/"
