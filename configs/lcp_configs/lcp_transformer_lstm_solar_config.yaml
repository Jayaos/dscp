device: 0
base_predictor: lstm # choices: lr, lstm, chronos


data:
  data_path: "./data/solar_prediction/${base_predictor}/${base_predictor}_nsdb-60m_data.pkl"
  train_ratio: 0.4
  valid_ratio: 0.1
  calibration_ratio: 0.16
  test_ratio: 0.34
  normalize: True
  strided_features: "xry"


model:
  dim_model: 64
  num_heads: 4
  num_layers: 2
  dropout: 0.
  use_current_feature: False
  training_quantiles: [0.1, 0.5, 0.9]
  target_quantiles:
    - [0.1, 0.9]
  prediction_step: 1
  window_size: 200
  calibration_size: 500
  rolling_calibration: True
  # Options: dot_product, cos_similarity, euclidean (negative squared distance / temperature).
  similarity_fn: "cos_similarity"
  temperature: 10.0
  sampling_num: 1000


training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 50
  early_stop: 3

plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/local_cp/solar/${base_predictor}/transformer/${now:%Y-%m-%d_%H-%M-%S_%f}/"
