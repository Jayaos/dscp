device: 0
base_predictor: lr # choices: lr, lstm, chronos


data:
  data_path: "./data/sapflux-solo3-large/${base_predictor}/${base_predictor}_sapflux-solo3-large_data.pkl"
  train_ratio: 0.4
  valid_ratio: 0.1
  calibration_ratio: 0.16
  test_ratio: 0.34
  normalize: True
  strided_features: "xr"


model:
  rnn_type: "lstm"
  dim_model: 64
  num_layers: 2
  dropout: 0.
  use_current_feature: False
  training_quantiles: [0.1, 0.5, 0.9]
  target_quantiles:
    - [0.025, 0.975]
  prediction_step: 1
  window_size: 200
  calibration_size: 500
  rolling_calibration: True
  # Options: dot_product, cos_similarity, euclidean (negative squared distance / temperature).
  similarity_fn: "cos_similarity"
  temperature: 10.0
  sampling_num: 1000


training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stop: 3

plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/local_cp/sapflux/${base_predictor}/rnn/${now:%Y-%m-%d_%H-%M-%S_%f}/"
