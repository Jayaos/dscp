device: 0
base_predictor: lr # choices: lr, lstm, chronos


data:
  data_path: "./data/air-10_prediction/${base_predictor}/${base_predictor}_air-10_data.pkl"
  train_ratio: 0.6
  valid_ratio: 0.1
  calibration_ratio: 0.1
  test_ratio: 0.2
  normalize: True
  strided_features: "xry"


model:
  dim_model: 32
  num_heads: 2
  num_layers: 4
  dropout: 0.
  use_current_feature: False
  training_quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
  target_quantiles:
    - [0.05, 0.950]
  prediction_step: 1
  window_size: 100
  calibration_size: 500
  rolling_calibration: true
  # Options: dot_product, cos_similarity, euclidean (negative squared distance / temperature).
  similarity_fn: "dot_product"
  temperature: 0.1
  sampling_num: 1000


training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 50
  early_stop: 3

plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/lcp_transformer_${base_predictor}_air/"

