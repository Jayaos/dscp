# Starting settings shared with the existing NexCP presets.
data:
  data_path: "./data/sapflux-solo3-large/chronos/chronos_sapflux-solo3-large_data.pkl"
  calibration_ratio: 0.66

model:
  rho: 0.99
  max_past: 200
  target_quantiles:
    - [0.05, 0.95]

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/nexcp/sapflux/chronos/"
