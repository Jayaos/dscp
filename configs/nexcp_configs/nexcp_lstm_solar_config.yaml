# Starting settings shared with the existing NexCP presets.
data:
  data_path: "./data/solar_prediction/lstm/lstm_nsdb-60m_data.pkl"
  calibration_ratio: 0.66

model:
  rho: 0.99
  max_past: 100
  target_quantiles:
    - [0.9, 0.1]

plotting:
  plotting: true
  plotting_seq_len: 200

saving_dir: "./results/nexcp/solar/lstm/${now:%Y-%m-%d_%H-%M-%S_%f}/"
