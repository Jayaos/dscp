device: 0


data:
  data_path: "./data/air-10/chronos/chronos_air-10_data.pkl"
  train_ratio: 0.7
  valid_ratio: 0.15
  normalize: True
  shifted_concatenation: False
  strided_features: "xr"


model:
  rnn_type: "lstm"
  dim_model: 64
  num_layers: 4
  dropout: 0.
  iqn_hidden_dim: 64
  cos_emb_dim: 64
  num_taus: 64
  target_quantiles:
    - [0.95, 0.05]
  prediction_step: 1
  window_size: 100


training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 1
  early_stop: 2


plotting:
  plotting: True
  plotting_seq_len: 200


saving_dir: "./results/run_test_iqn_rnn/"
