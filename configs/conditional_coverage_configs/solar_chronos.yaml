# Shared observed-target groups for solar, using the chronos forecast timeline.
# Comparisons identify original partitions; their interval coverage levels are unused.
path_base: ../..
dataset: solar
base_predictor: chronos
data_path: data/solar_prediction/chronos/chronos_nsdb-60m_data.pkl
output_dir: results/conditional_coverage/solar/chronos/groups
seed: 2026
device: cpu
num_threads: 1
cache_embeddings: true

model:
  rnn_type: lstm
  dim_model: 64
  num_layers: 1
  window_size: 100
  dropout: 0.0

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 50
  early_stop: 5
  validation_ratio: 0.2

clustering:
  k: 5
  n_init: 10

comparisons:
  - name: qr_rnn
    method: qr_cp
    config_path: configs/qr_cp_configs/qr_rnn_chronos_solar_config.yaml
  - name: qr_transformer
    method: qr_cp
    config_path: configs/qr_cp_configs/qr_transformer_chronos_solar_config.yaml
  - name: iqn_rnn
    method: iqn_cp
    config_path: configs/iqn_cp_configs/iqn_rnn_chronos_solar_config.yaml
  - name: iqn_transformer
    method: iqn_cp
    config_path: configs/iqn_cp_configs/iqn_transformer_chronos_solar_config.yaml
  - name: local_cp_rnn
    method: local_cp
    config_path: configs/lcp_configs/lcp_rnn_chronos_solar_config.yaml
  - name: local_cp_transformer
    method: local_cp
    config_path: configs/lcp_configs/lcp_transformer_chronos_solar_config.yaml
